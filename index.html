<script>
const CONFIG_DATABASE_URL = "https://script.google.com/macros/s/AKfycbz1mwg470fhqS1UtF8unQUpDlDoAamZDKkYo2OUaCieHPUpTlRq7s-IS3qvfnXEh_P2_w/exec";

const ADMIN_PASSWORD_PIN = "1979";
const ADMIN_PASSWORD_PIN = "abcd";

let sisterScore = 0; let littleScore = 0; let tasks = []; let pendingRewards = []; let taskHistory = [];
let avatarsData = { nhimAvatar: "", socAvatar: "", familyPhoto: "" };
let activeTabMobile = "tab-nhim"; 

function updateClock() {
  const now = new Date();
  const timeStr = now.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  const daysOfWeek = ['Chủ Nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];
  document.getElementById('clock').innerText = `${timeStr} • ${daysOfWeek[now.getDay()]} • ${now.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric' })}`;
}
setInterval(updateClock, 1000); updateClock();

function handleTemplateChange() {
  const select = document.getElementById('taskTemplate'); const wrapper = document.getElementById('customTaskWrapper');
  if (select.value === 'custom') { wrapper.style.visibility = 'visible'; wrapper.style.position = 'static'; } 
  else { wrapper.style.visibility = 'hidden'; wrapper.style.position = 'absolute'; }
}
handleTemplateChange();

function verifyAdminIdentity() {
  const password = prompt("🔐 Vui lòng nhập mã PIN bảo mật của Bố Mẹ để thực hiện:");
  if (password === ADMIN_PASSWORD_PIN) return true;
  alert("❌ Sai mã PIN! Hành động bị từ chối.");
  return false;
}

// 🕹️ HÀM SWITCH TAB 5 PHÂN HỆ CHO DI ĐỘNG KHÔNG CÒN BỊ RỐI
function switchTab(tabId) {
  if (window.innerWidth >= 768) return; 
  activeTabMobile = tabId;

  const tabs = ['tab-nhim', 'tab-soc', 'tab-shop', 'tab-admin', 'tab-history'];
  tabs.forEach(t => {
    document.getElementById(`btn-${t}`).className = "flex-1 py-2.5 text-center text-[11px] font-black rounded-xl transition-all text-slate-500 relative";
  });

  const activeBtn = document.getElementById(`btn-${tabId}`);
  if(tabId === 'tab-nhim') activeBtn.className = "flex-1 py-2.5 text-center text-[11px] font-black rounded-xl transition-all bg-pink-500 text-white shadow-sm relative";
  if(tabId === 'tab-soc') activeBtn.className = "flex-1 py-2.5 text-center text-[11px] font-black rounded-xl transition-all bg-sky-500 text-white shadow-sm relative";
  if(tabId === 'tab-shop') activeBtn.className = "flex-1 py-2.5 text-center text-[11px] font-black rounded-xl transition-all bg-amber-500 text-white shadow-sm relative";
  if(tabId === 'tab-admin') activeBtn.className = "flex-1 py-2.5 text-center text-[11px] font-black rounded-xl transition-all bg-purple-600 text-white shadow-sm relative";
  if(tabId === 'tab-history') activeBtn.className = "flex-1 py-2.5 text-center text-[11px] font-black rounded-xl transition-all bg-slate-800 text-white shadow-sm";

  // Cấu hình ẩn hiện các block
  document.getElementById('box-nhim').style.display = (tabId === 'tab-nhim') ? 'block' : 'none';
  document.getElementById('area-task-nhim').style.display = (tabId === 'tab-nhim') ? 'block' : 'none';

  document.getElementById('box-soc').style.display = (tabId === 'tab-soc') ? 'block' : 'none';
  document.getElementById('area-task-soc').style.display = (tabId === 'tab-soc') ? 'block' : 'none';

  document.getElementById('box-team').style.display = (tabId === 'tab-shop' || tabId === 'tab-admin') ? 'block' : 'none';
  document.getElementById('section-giao-viec').style.display = (tabId === 'tab-admin') ? 'block' : 'none';
  document.getElementById('rewardApprovalWrapper').style.setProperty('display', (tabId === 'tab-admin' && pendingRewards.length > 0) ? 'block' : 'none', 'important');

  document.getElementById('section-history').style.display = (tabId === 'tab-history') ? 'block' : 'none';

  if (tabId === 'tab-admin') {
    document.getElementById('section-nhiem-vu').style.display = 'grid';
    document.getElementById('area-task-nhim').style.display = 'block';
    document.getElementById('area-task-soc').style.display = 'block';
  } else if (tabId !== 'tab-nhim' && tabId !== 'tab-soc') {
    document.getElementById('section-nhiem-vu').style.display = 'none';
  } else {
    document.getElementById('section-nhiem-vu').style.display = 'block';
  }
}

function checkResponsiveLayout() {
  if (window.innerWidth >= 768) {
    document.getElementById('box-nhim').style.display = 'block';
    document.getElementById('area-task-nhim').style.display = 'block';
    document.getElementById('box-soc').style.display = 'block';
    document.getElementById('area-task-soc').style.display = 'block';
    document.getElementById('box-team').style.display = 'block';
    document.getElementById('section-giao-viec').style.display = 'block';
    document.getElementById('section-nhiem-vu').style.display = 'grid';
    document.getElementById('section-history').style.display = 'block';
    if(pendingRewards.length > 0) document.getElementById('rewardApprovalWrapper').style.setProperty('display', 'block', 'important');
  } else {
    switchTab(activeTabMobile);
  }
}
window.addEventListener('resize', checkResponsiveLayout);

async function cloudFetchSilent() {
  if(!CONFIG_DATABASE_URL) return;
  try {
    const res = await fetch(CONFIG_DATABASE_URL);
    const cloudData = await res.json();
    if(cloudData && cloudData.initialized) {
      sisterScore = cloudData.sisterScore || 0;
      littleScore = cloudData.littleScore || 0;
      tasks = cloudData.tasks || [];
      pendingRewards = cloudData.pendingRewards || [];
      taskHistory = cloudData.taskHistory || [];
      avatarsData = cloudData.avatarsData || { nhimAvatar: "", socAvatar: "", familyPhoto: "" };

      if(avatarsData.nhimAvatar) document.getElementById('nhimAvatar').src = avatarsData.nhimAvatar;
      if(avatarsData.socAvatar) document.getElementById('socAvatar').src = avatarsData.socAvatar;
      if(avatarsData.familyPhoto) document.getElementById('familyPhoto').src = avatarsData.familyPhoto;
    }
  } catch(e) { console.error("Lỗi tải ngầm:", e); }
  updateUIElements(); 
}

async function cloudFetchWithLoading() {
  if(!CONFIG_DATABASE_URL) return;
  document.getElementById('loadingUi').classList.remove('hidden');
  await cloudFetchSilent();
  document.getElementById('loadingUi').classList.add('hidden');
}

async function cloudPush() {
  if(!CONFIG_DATABASE_URL) return;
  document.getElementById('loadingUi').classList.remove('hidden');
  const payload = {
    initialized: true, sisterScore, littleScore, tasks, pendingRewards, taskHistory, avatarsData,
    lastResetDate: localStorage.getItem('lastResetDate') || ""
  };
  try {
    await fetch(CONFIG_DATABASE_URL, { method: "POST", body: JSON.stringify(payload) });
  } catch(e) { console.error("Lỗi đẩy:", e); }
  document.getElementById('loadingUi').classList.add('hidden');
  updateUIElements();
}

function updateUIElements() {
  document.getElementById('sisterScore').innerText = sisterScore;
  document.getElementById('littleScore').innerText = littleScore;
  document.getElementById('teamScore').innerText = sisterScore + littleScore;

  // 🔴 THÔNG BÁO CHO BỐ MẸ (Tab Duyệt)
  let countTasksWaiting = tasks.filter(t => t.completed && !t.approved).length;
  let countRewardsWaiting = pendingRewards.length;
  let totalWaitingAdmin = countTasksWaiting + countRewardsWaiting;

  const badgeMobile = document.getElementById('badgeCountMobile');
  if (totalWaitingAdmin > 0) {
    badgeMobile.innerText = totalWaitingAdmin; badgeMobile.classList.remove('hidden');
  } else { badgeMobile.classList.add('hidden'); }

  // 🔴 THÔNG BÁO CHO CÁC CON (Tab Nhím / Tab Sóc - Số việc chưa làm)
  let uncompletedNhim = tasks.filter(t => t.assignedTo === 'sister' && !t.completed).length;
  let uncompletedSoc = tasks.filter(t => t.assignedTo === 'little' && !t.completed).length;

  const badgeNhim = document.getElementById('badgeNhimMobile');
  if (uncompletedNhim > 0) {
    badgeNhim.innerText = uncompletedNhim; badgeNhim.classList.remove('hidden');
  } else { badgeNhim.classList.add('hidden'); }

  const badgeSoc = document.getElementById('badgeSocMobile');
  if (uncompletedSoc > 0) {
    badgeSoc.innerText = uncompletedSoc; badgeSoc.classList.remove('hidden');
  } else { badgeSoc.classList.add('hidden'); }

  renderTasks(); renderPendingRewards(); renderHistory();
  checkResponsiveLayout(); 
}

async function addTask() {
  const assignedTo = document.getElementById('assignPerson').value;
  const templateValue = document.getElementById('taskTemplate').value;
  let taskName = ""; let taskPoints = 0;
  if (templateValue === 'custom') {
    taskName = document.getElementById('customTaskName').value.trim(); taskPoints = Number(document.getElementById('customTaskPoints').value);
    if(!taskName || taskPoints <= 0) { alert('⚠️ Hãy nhập đầy đủ thông tin!'); return; }
  } else { const data = templateValue.split('|'); taskName = data[0]; taskPoints = Number(data[1]); }

  tasks.push({ name: taskName, points: taskPoints, assignedTo: assignedTo, completed: false, approved: false, proofImg: null });
  document.getElementById('customTaskName').value = ""; document.getElementById('customTaskPoints').value = "";

  updateUIElements();
  await cloudPush();
}

function handleTaskPhoto(event, index) {
  const file = event.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = function (e) {
    const img = new Image();
    img.onload = async function () {
      const canvas = document.createElement('canvas'); let width = img.width; let height = img.height;
      if (width > 400) { height = Math.round((height * 400) / width); width = 400; }
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      tasks[index].proofImg = canvas.toDataURL('image/jpeg', 0.6);
      tasks[index].completed = true;
      await cloudPush();
    }; img.src = e.target.result;
  }; reader.readAsDataURL(file);
}

async function completeTask(index) {
  if(tasks[index].completed || tasks[index].approved) return;
  tasks[index].completed = true; await cloudPush();
}

async function approveTask(index) {
  if(tasks[index].approved) return;
  if(!tasks[index].completed) { alert('⚠️ Nhiệm vụ này con chưa báo làm xong!'); return; }
  if (!verifyAdminIdentity()) return;

  tasks[index].approved = true;
  if(tasks[index].assignedTo === 'sister') { sisterScore += tasks[index].points; } else { littleScore += tasks[index].points; }
  saveHistoryLocal(tasks[index], 'task');
  tasks.splice(index, 1); await cloudPush();
}

function renderTasks() {
  const nhimList = document.getElementById('nhimTaskList'); const socList = document.getElementById('socTaskList');
  nhimList.innerHTML = ''; socList.innerHTML = ''; let nhimCount = 0; let socCount = 0;
  tasks.forEach((task, index) => {
    const card = document.createElement('div'); card.className = 'bg-slate-50 border border-slate-100 rounded-xl p-3 flex flex-col justify-between gap-3 shadow-sm';
    let imgHTML = task.proofImg ? `<div class="mt-2 relative w-14 h-14 cursor-zoom-in" onclick="openPhotoModal('${task.proofImg}')"><img src="${task.proofImg}" class="w-14 h-14 object-cover rounded-lg border border-slate-200"></div>` : '';
    card.innerHTML = `
      <div class="flex justify-between items-start gap-2 min-w-0">
        <div class="min-w-0 flex-1">
          <div class="text-sm font-bold text-slate-800 truncate">${task.name}</div>
          <div class="flex items-center gap-2 mt-1 flex-wrap"><span class="text-xs font-bold text-indigo-600 bg-indigo-50 px-1.5 py-0.5 rounded">+${task.points}đ</span>
            ${task.completed ? `<span class="text-[10px] bg-amber-50 text-amber-700 font-bold px-1.5 py-0.5 rounded border border-amber-100">${task.proofImg ? '📸 Có ảnh chờ duyệt' : '⏳ Chờ duyệt'}</span>` : `<span class="text-[10px] bg-red-100 text-red-700 font-black px-1.5 py-0.5 rounded border border-red-200 animate-pulse-danger">🚨 Nguy cơ trừ điểm!</span>`}
          </div>${imgHTML}
        </div>
      </div>
      <div class="flex justify-end gap-1.5 pt-2 border-t border-slate-100/60">
        <label class="px-2 py-1.5 bg-white border border-slate-200 hover:bg-slate-100 rounded-lg text-xs font-bold cursor-pointer flex items-center gap-1 ${task.completed ? 'opacity-40 cursor-not-allowed pointer-events-none' : ''}">📷 Gửi ảnh <input type="file" hidden accept="image/*" onchange="handleTaskPhoto(event, ${index})"></label>
        <button onclick="completeTask(${index})" class="px-2.5 py-1.5 bg-white border border-slate-200 hover:bg-slate-100 rounded-lg text-xs font-bold ${task.completed ? 'opacity-40 cursor-not-allowed' : ''}">✔ Xong thường</button>
        <button onclick="approveTask(${index})" class="px-2.5 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-bold shadow-sm">👨‍👩‍👧 Duyệt</button>
      </div>`;
    if(task.assignedTo === 'sister') { nhimList.appendChild(card); nhimCount++; } else { socList.appendChild(card); socCount++; }
  });
  document.getElementById('nhimTaskCount').innerText = nhimCount; document.getElementById('socTaskCount').innerText = socCount;
  if(nhimCount === 0) nhimList.innerHTML = '<div class="text-xs text-slate-400 text-center py-4 italic">Hôm nay Nhím chưa có việc gì!</div>';
  if(socCount === 0) socList.innerHTML = '<div class="text-xs text-slate-400 text-center py-4 italic">Hôm nay Sóc chưa có việc gì!</div>';
}

// 🔐 KHÓA BẢO MẬT: BẤT KỲ QUÀ CỐ ĐỊNH NÀO CŨNG PHẢI ĐẨY VÀO HÀNG ĐỢI CHỜ DUYỆT CHỨ KHÔNG ĐƯỢC TRỪ THẲNG ĐIỂM NGHIỄM NHIÊN
async function requestReward(points, rewardName) {
  const total = sisterScore + littleScore; 
  if(total < points) { alert('❌ Điểm tích lũy hiện tại của cả đội chưa đủ để gửi yêu cầu đổi món quà này!'); return; }
  if(!confirm(`Con xác nhận dùng ${points} điểm chung để gửi đề xuất đổi quà [${rewardName}] lên bố mẹ không?`)) return;

  pendingRewards.push({ name: rewardName, points: points });
  await cloudPush(); 
  alert('📢 Đã gửi đề xuất thành công! Con hãy đợi bố mẹ duyệt cho phép nhé.');
}

async function requestCustomReward() {
  const name = document.getElementById('customRewardName').value.trim(); const points = Number(document.getElementById('customRewardPoints').value);
  if(!name || points <= 0) { alert('⚠️ Hãy điền đầy đủ thông tin!'); return; }
  pendingRewards.push({ name: `🤝 Thương lượng: ${name}`, points: points });
  document.getElementById('customRewardName').value = ""; document.getElementById('customRewardPoints').value = "";
  await cloudPush(); alert('📢 Đã gửi đề xuất thương lượng lên hệ thống!');
}

function renderPendingRewards() {
  const wrapper = document.getElementById('rewardApprovalWrapper'); const container = document.getElementById('rewardApprovalList');
  if (pendingRewards.length === 0) { wrapper.classList.add('hidden'); return; }
  wrapper.classList.remove('hidden');
  container.innerHTML = pendingRewards.map((reward, index) => `
    <div class="bg-white border border-amber-200 rounded-xl p-3 flex justify-between items-center text-xs shadow-sm">
      <div><span class="text-amber-800 font-bold">🎁 Yêu cầu đổi quà:</span> <span class="font-extrabold text-slate-800 text-sm">${reward.name}</span><span class="block text-[10px] text-slate-400 mt-0.5">Giá trị quỹ chung cần trừ: <b class="text-amber-600">${reward.points}đ</b></span></div>
      <div class="flex gap-1.5">
        <button onclick="approveCustomReward(${index})" class="px-3 py-1.5 bg-gradient-to-r from-amber-500 to-orange-500 text-white rounded-lg font-black shadow-sm">👍 Cho phép</button>
        <button onclick="rejectCustomReward(${index})" class="px-2 py-1.5 bg-slate-200 text-slate-600 rounded-lg font-bold">❌ Từ chối</button>
      </div>
    </div>`).join('');
}

async function approveCustomReward(index) {
  const reward = pendingRewards[index]; const total = sisterScore + littleScore;
  if (total < reward.points) { alert('❌ Điểm quỹ chung hiện không đủ để phê duyệt phần quà này!'); return; }
  if (!verifyAdminIdentity()) return;

  executeScoreDeduction(reward.points); 
  saveHistoryLocal({ name: reward.name, points: reward.points }, 'reward');
  pendingRewards.splice(index, 1); await cloudPush();
  alert('✅ Đã phê duyệt cấp quà và khấu trừ điểm thành công!');
}

async function rejectCustomReward(index) {
  if (!verifyAdminIdentity()) return;
  if (confirm('Bố mẹ từ chối yêu cầu đổi quà này của các con?')) { pendingRewards.splice(index, 1); await cloudPush(); }
}

function openPhotoModal(base64Src) { document.getElementById('modalImg').src = base64Src; document.getElementById('photoModal').classList.remove('hidden'); }
function closePhotoModal() { document.getElementById('photoModal').classList.add('hidden'); }

function saveHistoryLocal(item, type) {
  taskHistory.unshift({
    name: item.name, points: item.points, assignedTo: item.assignedTo || null, type: type,
    time: new Date().toLocaleTimeString('vi-VN', {hour: '2-digit', minute:'2-digit'})
  });
}

function renderHistory() {
  const container = document.getElementById('historyContainer');
  if(!taskHistory || taskHistory.length === 0) { container.innerHTML = '<div class="bg-slate-50 rounded-xl p-4 text-center text-xs text-slate-400">Chưa có hoạt động nào được ghi nhận.</div>'; return; }
  container.innerHTML = taskHistory.map(item => {
    if (item.type === 'reward') {
      return `<div class="bg-red-50/50 border border-red-100 rounded-xl p-3 flex justify-between items-center text-xs">
          <div><span class="font-bold text-red-600">🎁 ĐÃ ĐỔI QUÀ:</span> <span class="font-semibold text-slate-900">${item.name}</span><span class="text-slate-400 block text-[10px] mt-0.5">⏱ Duyệt đổi lúc ${item.time}</span></div>
          <div class="text-red-600 font-extrabold text-sm shrink-0">-${item.points}đ</div>
        </div>`;
    } else if (item.type === 'penalty') {
      return `<div class="bg-amber-100 border border-amber-200 rounded-xl p-3 flex justify-between items-center text-xs">
          <div><span class="font-black text-amber-700">🚨 PHẠT SANG NGÀY:</span> <span class="font-bold text-slate-800">${item.assignedTo === 'sister' ? 'Nhím' : 'Sóc'}</span> <span class="text-slate-600">bị trừ điểm do lười: ${item.name}</span></div>
          <div class="text-amber-700 font-black text-sm shrink-0">-${item.points}đ</div>
        </div>`;
    } else {
      return `<div class="bg-slate-50 border border-slate-100 rounded-xl p-3 flex justify-between items-center text-xs">
          <div><span class="font-bold text-slate-800">${item.assignedTo === 'sister' ? '👧 Nhím' : '👧 Sóc'}</span> <span class="text-slate-600">hoàn thành:</span> <span class="font-semibold text-slate-900">${item.name}</span><span class="text-slate-400 block text-[10px] mt-0.5">⏱ Duyệt lúc ${item.time}</span></div>
          <div class="text-emerald-600 font-extrabold text-sm shrink-0">+${item.points}đ</div>
        </div>`;
    }
  }).join('');
}

function secureLoadAvatar(id) {
  if (!verifyAdminIdentity()) return; 

  const fileInput = document.getElementById('secureImageInput');
  fileInput.onchange = function(event) {
    const file = event.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = function (e) {
      const img = new Image();
      img.onload = async function () {
        const canvas = document.createElement('canvas');
        let targetWidth = (id === 'familyPhoto') ? 550 : 180; 
        let width = img.width; let height = img.height;
        if (width > targetWidth) { height = Math.round((height * targetWidth) / width); width = targetWidth; }
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);

        const optimizedBase64 = canvas.toDataURL('image/jpeg', 0.5);
        document.getElementById(id).src = optimizedBase64;
        avatarsData[id] = optimizedBase64;
        await cloudPush();
      }; img.src = e.target.result;
    }; reader.readAsDataURL(file);
  };
  fileInput.click();
}

async function secureRemoveAvatar(id) {
  if (!verifyAdminIdentity()) return;
  const defaultAvatar = id === 'nhimAvatar' ? 'https://cdn-icons-png.flaticon.com/512/4140/4140048.png' : 'https://cdn-icons-png.flaticon.com/512/4140/4140051.png';
  document.getElementById(id).src = defaultAvatar; avatarsData[id] = ""; await cloudPush();
}

async function secureResetAllData() {
  const password = prompt("🚨 CẢNH BÁO: Nhập mã PIN của Bố để XÓA VĨNH VIỄN toàn bộ dữ liệu đám mây:");
  if (password !== ADMIN_PASSWORD_PIN) { alert("❌ Sai mã PIN!"); return; }

  if(confirm('Bạn có chắc chắn 100% muốn xóa sạch điểm số và lịch sử không?')) {
    sisterScore = 0; littleScore = 0; tasks = []; pendingRewards = []; taskHistory = [];
    avatarsData = { nhimAvatar: "", socAvatar: "", familyPhoto: "" };
    document.getElementById('nhimAvatar').src = 'https://cdn-icons-png.flaticon.com/512/4140/4140048.png';
    document.getElementById('socAvatar').src = 'https://cdn-icons-png.flaticon.com/512/4140/4140051.png';
    document.getElementById('familyPhoto').src = 'https://images.unsplash.com/photo-1542038784456-1ea8e935640e?q=80&w=600&auto=format&fit=crop';
    await cloudPush();
  }
}

async function autoResetDailyTasks() {
  const today = new Date().toLocaleDateString('vi-VN');
  const lastReset = localStorage.getItem('lastResetDate');

  if(lastReset && lastReset !== today) {
    tasks.forEach(task => {
      if(!task.completed && !task.approved) {
        if(task.assignedTo === 'sister') { sisterScore = Math.max(0, sisterScore - task.points); } 
        else { littleScore = Math.max(0, littleScore - task.points); }
        saveHistoryLocal({ name: task.name, points: task.points, assignedTo: task.assignedTo }, 'penalty');
      }
    });
    tasks = []; localStorage.setItem('lastResetDate', today);
    await cloudPush();
  } else if (!lastReset) { localStorage.setItem('lastResetDate', today); }
}

async function initSystem() {
  await cloudFetchWithLoading();
  await autoResetDailyTasks();

  setInterval(async () => {
    await cloudFetchSilent();
  }, 10000); 
}
initSystem();
</script>
